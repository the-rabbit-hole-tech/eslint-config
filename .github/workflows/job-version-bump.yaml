name: Release Manager

on:
  push:
    branches:
      - main

# One run per branch, and it is left to finish. This one publishes,
# and a publish interrupted half way through is worse than a publish
# that waited.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  Update_Version:
    name: 🚀 Update Changelog & Prep Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 📂 Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # A dry run writes nothing: it only reports the version the labels
      # resolve to, so the next step can correct it before the draft exists.
      - name: 🔍 Release Drafter (Resolve Version)
        id: resolve
        uses: release-drafter/release-drafter@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: true

      # release-drafter turns the `breaking` label into a major bump whatever
      # the current version is, so a breaking change on 0.x would jump to
      # 1.0.0. Below 1.0.0 a breaking change moves the minor number instead.
      # This lives here rather than in release-drafter.yml because that file
      # is overwritten by the hub governance sync.
      - name: 🔢 Keep 0.x Breaking Changes on a Minor Bump
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED: ${{ steps.resolve.outputs.resolved_version }}
        run: |
          version="$RESOLVED"
          last="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          last="${last#v}"
          echo "Last published release: ${last:-none}; release-drafter resolved: ${RESOLVED:-none}"
          if [ -n "$last" ] && [ -n "$RESOLVED" ]; then
            IFS=. read -r last_major last_minor _ <<< "$last"
            resolved_major="${RESOLVED%%.*}"
            if [ "$last_major" = 0 ] && [ "$resolved_major" != 0 ]; then
              version="0.$((last_minor + 1)).0"
              echo "Below 1.0.0: holding the major bump ($RESOLVED) to a minor bump ($version)."
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 📝 Release Drafter (Anticipate Version)
        id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.version.outputs.version }}

      - name: Detect releasable changes
        id: releasable
        env:
          BODY: ${{ steps.drafter.outputs.body }}
        run: |
          # On a push, skip the prep when release-drafter found no PR entries
          # (nothing releasable) so the manifest does not drift ahead.
          if printf '%s' "$BODY" | grep -qE '\(#[0-9]+\)'; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable changes since the last release; skipping the prep commit."
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔢 Bump Package Version
        if: steps.releasable.outputs.yes == 'true'
        run: npm version "v${{ steps.drafter.outputs.resolved_version }}" --no-git-tag-version --allow-same-version

      - name: 📤 Run Changelog Action
        if: steps.releasable.outputs.yes == 'true'
        env:
          LOG_LEVEL: debug
          LOG_FORMAT: text
          RELEASE_NOTES: >-
            ${{ steps.drafter.outputs.body }}
          RELEASE_VERSION: v${{ steps.drafter.outputs.resolved_version }}
        uses: bugs5382/changelog-updater-action@v0.3.2
        with:
          tag: ${{ env.RELEASE_VERSION }}
          notes: ${{ env.RELEASE_NOTES }}
          diff: 'true'

      - name: 📤 Commit and Push Version Update
        if: steps.releasable.outputs.yes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(pre-release): v${{ steps.drafter.outputs.resolved_version }} [skip ci]"
          commit_user_name: ${{ github.actor }}
          commit_user_email: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          commit_author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
