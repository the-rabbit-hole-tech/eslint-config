name: License Check
# Fail if a 3rd-party npm dependency carries a license outside the allowlist.
# No SAST/vuln scanning (deliberately out of scope).
#
# npm only: this is an npm package with no go.mod, so the Go job the shared
# template carried is gone. It started a runner on every run just to find no
# go.mod and skip.
#
# Pull requests that change package.json or the lockfile only, and not while
# the PR is a draft. There is no rerun on push to main: the PR run already
# checked the dependency set being merged.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'package.json'
      - 'package-lock.json'
# One run per PR: a new push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  npm:
    name: 📦 npm dependency licenses
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check dependency licenses
        run: |
          npx --yes license-checker-rseidelsohn \
            --production --excludePrivatePackages \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0;MPL-2.0;CC-BY-4.0"
