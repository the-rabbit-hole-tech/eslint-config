name: Test
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    # Pull requests only, and not while the PR is a draft. There is no push
    # trigger: the PR run already tested the tree being merged, so nothing
    # reruns on push to main. Release and Publish still calls this workflow
    # (workflow_call) before it publishes.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - 'LICENSE'
# One run per PR per workflow: a new push cancels the older PR run. A run
# called by Release and Publish is never cancelled.
# The fixed `test` segment keeps this group apart from a caller's: a
# reusable workflow sees the caller's github.workflow, and a shared group
# between the two is a deadlock that cancels the run.
concurrency:
  group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  Build:
    name: 🧪 Build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: arc-runner-set
    # Three Node versions on the arm64 runners: install, test, build and lint
    # each take a few minutes there.
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [24.x, 'lts/*', 'latest']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps

      - name: Test with Node ${{matrix.node-version}}
        uses: actions/setup-node@v6
        with:
          node-version: ${{matrix.node-version}}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Run Tests
        run: |
          npm test

      - name: Run Build
        run: |
          npm run build

      # eslint.config.mjs lints this repo with its own built config
      # (./lib/esm/index.mjs), so on a fresh checkout ESLint cannot load
      # until the build has run.
      - name: Lint
        run: npm run lint

      - name: Upload build artifact
        if: matrix.node-version == 'lts/*'
        uses: actions/upload-artifact@v7
        with:
          name: lib
          path: |
            package.json
            package-lock.json
            README.md
            LICENSE
            CHANGELOG.md
            ./lib

  # Run the suite against each eslint major the package advertises in its peer
  # range. The integration tests load the config through createESLintConfig and
  # run real ESLint, so a bundled plugin that drops support for one major fails
  # at config-load time here instead of shipping (regression guard for #51).
  ESLintCompat:
    name: 🧩 ESLint ${{ matrix.eslint }}.x
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: arc-runner-set
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        eslint: ['9', '10']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Pin eslint ${{ matrix.eslint }}.x
        run: npm install --no-save --ignore-scripts --legacy-peer-deps "eslint@${{ matrix.eslint }}"

      - name: Show resolved eslint version
        run: npx eslint --version

      - name: Run tests against eslint ${{ matrix.eslint }}.x
        run: npm test
